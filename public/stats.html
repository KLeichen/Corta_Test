<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: estadísticas</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html">
        <img src="logo.png" alt="" class="logo">
        <span>Corta</span>
      </a>
      <nav class="nav">
        <a href="index.html">Acortar un link</a>
      </nav>
    </header>

    <main class="layout layout-una-columna">
      <section class="panel panel-principal">
        <h1>Estadísticas</h1>
        <p class="sub">Consultá los números de un link corto.</p>

        <form id="form-stats">
          <input type="text" id="codigo" placeholder="ej: a3k" required>
          <button type="submit" id="boton-buscar">Buscar</button>
        </form>

        <p id="error" class="mensaje-error oculto"></p>

        <div id="stats" class="stats oculto">
          <div class="stat"><span id="stat-clicks" class="numero"></span><span class="etiqueta">clicks</span></div>
          <div class="stat"><span id="stat-url" class="numero"></span><span class="etiqueta">URL original</span></div>
          <div class="stat"><span id="stat-creado" class="numero"></span><span class="etiqueta">creado el</span></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const form = document.getElementById('form-stats');
    const stats = document.getElementById('stats');
    const error = document.getElementById('error');
    const codigoInput = document.getElementById('codigo');
    const botonBuscar = document.getElementById('boton-buscar');

    function animarConteo(el, hasta) {
      const duracion = 700;
      const inicio = performance.now();
      function paso(ahora) {
        const progreso = Math.min((ahora - inicio) / duracion, 1);
        const facilitado = 1 - Math.pow(1 - progreso, 3);
        el.textContent = Math.round(facilitado * hasta);
        if (progreso < 1) requestAnimationFrame(paso);
      }
      requestAnimationFrame(paso);
    }

    async function buscar(codigo) {
      stats.classList.add('oculto');
      error.classList.add('oculto');
      botonBuscar.disabled = true;
      botonBuscar.innerHTML = '<span class="spinner"></span>Buscando...';

      try {
        const res = await fetch(`/api/links/${encodeURIComponent(codigo)}/stats`);
        if (!res.ok) {
          error.textContent = 'No existe ese link';
          error.classList.remove('oculto');
          return;
        }

        const data = await res.json();
        animarConteo(document.getElementById('stat-clicks'), data.clicks);
        document.getElementById('stat-url').textContent = data.url;
        document.getElementById('stat-creado').textContent = new Date(data.creado).toLocaleDateString();
        stats.classList.remove('oculto');
      } finally {
        botonBuscar.disabled = false;
        botonBuscar.textContent = 'Buscar';
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      buscar(codigoInput.value.trim());
    });

    const codigoUrl = new URLSearchParams(window.location.search).get('codigo');
    if (codigoUrl) {
      codigoInput.value = codigoUrl;
      buscar(codigoUrl);
    }
  </script>
</body>
</html>
